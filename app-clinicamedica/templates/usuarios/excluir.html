{% extends "base.html" %}
{% block title %} Excluir usuário {% endblock %}
{% block content %}
    <h1>Excluir usuário</h1>
    <p>
        Deseja realmente excluir
        <strong>{{ usuario.username }}</strong>?
    </p>
    <form method="post">
        {% csrf_token %}
        <button class="danger" type="submit">Confirmar exclusão</button>
        <a href="{% url 'usuarios_lista' %}">Cancelar</a>
    </form>
{% endblock %}
