<!DOCTYPE html>
{% load static %}
<html lang="pt-BR" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Clínica Médica</title>
        <style>
            body {
                min-height: 100vh;
            }
            .card {
                width: 75% !important;
            }
            .dashboard-card {
                width: 100% !important;
                transition: border-color .15s ease, transform .15s ease;
            }
            .patient-form-card {
                width: 100% !important;
            }
            .dashboard-card:hover {
                border-color: var(--bs-primary) !important;
                transform: translateY(-2px);
            }
        </style>
    </head>
        <body class="bg-body text-body">
            {% block navbar %}
            <nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-4">
                <div class="container">
                    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
                        <img src="{% static 'img/logo-sistema.png' %}" width="40" height="40" alt="Logo">
                        <span class="fw-semibold">Clínica Médica</span>
                    </a>
                </div>
            </nav>
            {% endblock %}
            <main class="container {% block main_class %}{% endblock %}">
                {% block content %}{% endblock %}
            </main>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        </body>
</html>
