
services:
  db:
    image: postgres:16-alpine
    container_name: app-clinicamedica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicamedica
      POSTGRES_USER: clinicamedica
      POSTGRES_PASSWORD: clinicamedica
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicamedica -d clinicamedica"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-clinicamedica:1.0
    container_name: app-clinicamedica
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      VIRTUAL_ENV: /opt/venv
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    command: sh -c "/opt/venv/bin/python manage.py migrate && /opt/venv/bin/python manage.py runserver 0.0.0.0:8000"

  pgadmin:
    image: pgadmin4:3.24.3
    container_name: app-clinicamedica-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinicamedica.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
